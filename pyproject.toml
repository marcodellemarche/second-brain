[project]
name = "second-brain"
version = "0.1.0"
description = "A self-hosted personal assistant built on top of Hermes Agent."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "mcp>=1.20,<2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]

[tool.ruff]
line-length = 110
extend-exclude = [".work"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
