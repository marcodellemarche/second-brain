[project]
name = "second-brain"
dynamic = ["version"]
description = "A self-hosted personal assistant built on top of Hermes Agent."
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2",
    "pyyaml",
    "mcp>=1.20,<2",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
sb = "second_brain.cli.main:main"

[project.entry-points."hermes_agent.plugins"]
brain-guard = "second_brain.guard.plugin:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/second_brain/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/second_brain"]

[tool.ruff]
line-length = 110
extend-exclude = [".work"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
